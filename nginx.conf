# nginx.conf — drop this in /etc/nginx/sites-available/voice-tts
# For domain deployment: replace "yourdomain.com" and set up SSL with certbot

upstream voice_tts {
    server localhost:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    # Redirect HTTP → HTTPS (enable after setting up SSL)
    # return 301 https://$host$request_uri;

    client_max_body_size 50M;

    # Proxy to FastAPI (which serves React static files too)
    location / {
        proxy_pass http://voice_tts;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;   # TTS can take a while
        proxy_send_timeout 120s;
    }
}

